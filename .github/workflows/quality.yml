name: Quality

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Frontend, generated docs, and Go
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install frontend dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Lint frontend
        working-directory: web
        run: bun run lint

      - name: Type-check frontend
        working-directory: web
        run: bun run typecheck

      - name: Test frontend
        working-directory: web
        run: bun run test

      - name: Build frontend
        working-directory: web
        run: bun run build

      - name: Verify embedded frontend is current
        run: git diff --exit-code -- web/dist

      - name: Verify generated API documentation is current
        run: |
          ./gen_api_docs.sh
          git diff --exit-code -- docs/api_methods.md

      - name: Test Go packages
        run: go test ./...

      - name: Test Go packages with race detector
        run: go test -race ./...

      - name: Vet Go packages
        run: go vet ./...

      - name: Build Go packages
        run: go build ./...

      - name: Verify systemd package lifecycle
        shell: bash
        run: |
          set -euo pipefail
          bash -n example_files/install_vllm-use.sh
          systemd-analyze security --offline=yes example_files/vllm-use.service >/dev/null
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          mkdir -p "$work/payload" "$work/root"
          cp example_files/install_vllm-use.sh example_files/vllm-use.service example_files/vllm-use.env "$work/payload/"
          go build -o "$work/payload/vllm-use" .
          VLLM_USE_INSTALL_ROOT="$work/root" "$work/payload/install_vllm-use.sh" install
          test -x "$work/root/usr/local/bin/vllm-use"
          test "$(stat -c '%a' "$work/root/etc/vllm-use/vllm-use.env")" = 600
          printf '\n# preserved operator override\n' >> "$work/root/etc/vllm-use/vllm-use.env"
          VLLM_USE_INSTALL_ROOT="$work/root" "$work/payload/install_vllm-use.sh" update
          grep -q '^# preserved operator override$' "$work/root/etc/vllm-use/vllm-use.env"
          VLLM_USE_INSTALL_ROOT="$work/root" "$work/payload/install_vllm-use.sh" uninstall
          test ! -e "$work/root/usr/local/bin/vllm-use"
          test ! -e "$work/root/etc/systemd/system/vllm-use.service"
          test -f "$work/root/etc/vllm-use/vllm-use.env"
          test -d "$work/root/var/lib/vllm-use"
