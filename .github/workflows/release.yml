name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify, package, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate release contract
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^[[:space:]]*ProjectVersion[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' config/config.go | head -n1)"
          test -n "$version"
          test "$version" = "$GITHUB_REF_NAME"
          test -s "changelog/${GITHUB_REF_NAME}.md"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install frontend dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Verify frontend source
        working-directory: web
        run: |
          bun run lint
          bun run typecheck
          bun run test
          bun run build

      - name: Verify generated assets and API documentation
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- web/dist
          ./gen_api_docs.sh "$GITHUB_REF_NAME"
          git diff --exit-code -- docs/api_methods.md

      - name: Verify Go source
        run: |
          go test ./...
          go test -race ./...
          go vet ./...
          go build ./...

      - name: Build release archive
        run: bash ./build.sh release

      - name: Inspect release payload
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(build/upload_tmp_dir/*.zip)
          test "${#archives[@]}" -eq 1
          unzip -t "${archives[0]}"
          unzip -Z1 "${archives[0]}" | grep -Fx 'vllm-use/vllm-use'
          unzip -Z1 "${archives[0]}" | grep -Fx 'vllm-use/vllm-use.service'
          unzip -Z1 "${archives[0]}" | grep -Fx 'vllm-use/vllm-use.env'
          unzip -Z1 "${archives[0]}" | grep -Fx 'vllm-use/install_vllm-use.sh'

      - name: Smoke exact packaged binary
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          pid=""
          cleanup() {
            if [[ -n "$pid" ]]; then
              kill -TERM "$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
            fi
            rm -rf "$work"
          }
          trap cleanup EXIT
          admin_token="release-smoke-admin-${GITHUB_RUN_ID}"
          export VLLM_USE_LISTEN=127.0.0.1:18080
          export VLLM_USE_DATA_DIR="$work/data"
          export VLLM_USE_ADMIN_TOKEN="$admin_token"
          export VLLM_USE_VLLM_BINARY="$work/missing-vllm"
          export VLLM_USE_HF_CLI="$work/missing-hf"
          build/release/vllm-use/vllm-use >"$work/service.log" 2>&1 &
          pid=$!
          for _ in {1..50}; do
            if curl --fail --silent --show-error http://127.0.0.1:18080/healthz >"$work/health.json"; then
              break
            fi
            kill -0 "$pid"
            sleep 0.1
          done
          grep -F '"status":"ok"' "$work/health.json"
          curl --fail --silent --show-error http://127.0.0.1:18080/ >"$work/index.html"
          grep -F '<div id="root"></div>' "$work/index.html"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $admin_token" \
            http://127.0.0.1:18080/api/system >"$work/system.json"
          grep -F '"vllm"' "$work/system.json"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $admin_token" \
            -H 'Content-Type: application/json' \
            --data '{"name":"release-smoke","scopes":["mcp.read"]}' \
            http://127.0.0.1:18080/api/keys >"$work/key.json"
          mcp_key="$(jq -er '.secret' "$work/key.json")"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $mcp_key" \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -H 'Mcp-Protocol-Version: 2026-07-28' \
            -H 'Mcp-Method: tools/call' \
            -H 'Mcp-Name: test' \
            --data '{"jsonrpc":"2.0","id":"release-smoke","method":"tools/call","params":{"name":"test","arguments":{},"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientInfo":{"name":"release-smoke","version":"1.0.0"},"io.modelcontextprotocol/clientCapabilities":{"extensions":{}}}}}' \
            http://127.0.0.1:18080/mcp >"$work/mcp.json"
          jq -e '.id == "release-smoke" and .result.isError == false and .result.resultType == "complete"' "$work/mcp.json"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(build/upload_tmp_dir/*.zip)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${archives[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${archives[@]}" \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --notes-file "changelog/${GITHUB_REF_NAME}.md"
          fi
